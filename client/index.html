<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Jahid's portrait, cut from assets/profile/profile-portrait-square.webp. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#09090b" />
    <!-- Applies the visitor's theme, accent and font before first paint (no
         flash of the wrong look). Mirrors getInitialTheme/Accent/Font() in
         src/features/preferences/preference-storage.js. -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = "dark";
        var accent = "lime";
        var font = "geist";
        try {
          var stored = localStorage.getItem("theme");
          if (stored === "light" || stored === "dark") theme = stored;
          else if (matchMedia("(prefers-color-scheme: light)").matches)
            theme = "light";
          var storedAccent = localStorage.getItem("accent");
          if (/^(violet|sky|lime|amber|rose)$/.test(storedAccent))
            accent = storedAccent;
          var storedFont = localStorage.getItem("font");
          if (/^(geist|inter|grotesk|system)$/.test(storedFont))
            font = storedFont;
        } catch (e) {}
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-accent", accent);
        root.setAttribute("data-font", font);
      })();
    </script>
    <!-- route-meta -->
    <!-- Head tags for "/". scripts/prerender.js rewrites this block in every
         built route's HTML (absolute URLs, per-route title/description), and
         usePageMeta keeps it in sync during client-side navigation. -->
    <title>
      Jahid Hasan — Frontend Developer &amp; Junior Software Engineer
    </title>
    <meta
      name="description"
      content="Portfolio of Jahid Hasan, a CSE graduate and React-focused frontend developer building modern web products and expanding into full-stack and AI-enabled engineering."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jahid Hasan" />
    <meta
      property="og:title"
      content="Jahid Hasan — Frontend Developer &amp; Junior Software Engineer"
    />
    <meta
      property="og:description"
      content="Portfolio of Jahid Hasan, a CSE graduate and React-focused frontend developer building modern web products and expanding into full-stack and AI-enabled engineering."
    />
    <meta property="og:image" content="/assets/og/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/og/og-default.png" />
    <!-- /route-meta -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
