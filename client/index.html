<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Jahid's portrait, cut from assets/profile/profile-portrait-square.webp. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Jahid Hasan — Writing"
      href="/rss.xml"
    />
    <meta name="theme-color" content="#09090b" />
    <!-- Applies the visitor's theme, accent and font before first paint (no
         flash of the wrong look). Mirrors getInitialTheme/Accent/Font() in
         src/features/preferences/preference-storage.js. The __SITE_*__
         defaults are filled in from Site settings by vite.config.js. -->
    <script>
      (function () {
        var root = document.documentElement;
        var siteTheme = "__SITE_THEME__";
        var theme = siteTheme === "light" ? "light" : "dark";
        var accent = "__SITE_ACCENT__";
        var font = "__SITE_FONT__";
        var scene = "__SITE_SCENE__";
        try {
          var stored = localStorage.getItem("theme");
          // A visitor's own theme pick (from before scenes existed, too)
          // wins over the site's default scene.
          var storedScene = localStorage.getItem("scene");
          if (
            /^(none|season|darkroom|cyanotype|golden-hour|night-shoot|grishma|barsha|sharat|hemanta|sheet|basanta)$/.test(
              storedScene,
            )
          )
            scene = storedScene;
          else if (stored === "light" || stored === "dark") scene = "none";
          if (stored === "light" || stored === "dark") theme = stored;
          else if (
            siteTheme === "system" &&
            matchMedia("(prefers-color-scheme: light)").matches
          )
            theme = "light";
          var storedAccent = localStorage.getItem("accent");
          if (/^(violet|sky|lime|amber|rose)$/.test(storedAccent))
            accent = storedAccent;
          var storedFont = localStorage.getItem("font");
          if (/^(geist|inter|grotesk|system)$/.test(storedFont))
            font = storedFont;
        } catch (e) {}
        // "season" follows the Bangla calendar (docs/15). Mirrors seasonOn()
        // in src/features/preferences/seasons.js.
        if (scene === "season") {
          var now = new Date();
          var day = (now.getMonth() + 1) * 100 + now.getDate();
          scene = "sheet";
          if (day >= 214) scene = "basanta";
          if (day >= 414) scene = "grishma";
          if (day >= 615) scene = "barsha";
          if (day >= 816) scene = "sharat";
          if (day >= 1017) scene = "hemanta";
          if (day >= 1216) scene = "sheet";
        }
        if (
          /^(darkroom|cyanotype|golden-hour|night-shoot|grishma|barsha|sharat|hemanta|sheet|basanta)$/.test(
            scene,
          )
        ) {
          theme = /^(golden-hour|sharat|sheet|basanta)$/.test(scene)
            ? "light"
            : "dark";
          accent = "lime";
          root.setAttribute("data-scene", scene);
        }
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-accent", accent);
        root.setAttribute("data-font", font);
        // First visit this session: cover the prerendered page until the
        // opening animation takes over (OpeningCurtain.jsx), so it doesn't
        // flash first. Mirrors shouldPlayOnLoad() there.
        try {
          if (
            "__SITE_INTRO__" === "on" &&
            !navigator.webdriver &&
            !/^\/admin(\/|$)/.test(location.pathname) &&
            !matchMedia("(prefers-reduced-motion: reduce)").matches &&
            sessionStorage.getItem("opening-seen") !== "1"
          )
            root.setAttribute("data-intro", "");
        } catch (e) {}
      })();
    </script>
    <!-- route-meta -->
    <!-- Head tags for "/". scripts/prerender.js rewrites this block in every
         built route's HTML (absolute URLs, per-route title/description), and
         usePageMeta keeps it in sync during client-side navigation. -->
    <title>
      Jahid Hasan — Frontend Developer &amp; Junior Software Engineer
    </title>
    <meta
      name="description"
      content="Portfolio of Jahid Hasan, a CSE graduate and React-focused frontend developer building modern web products and expanding into full-stack and AI-enabled engineering."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jahid Hasan" />
    <meta
      property="og:title"
      content="Jahid Hasan — Frontend Developer &amp; Junior Software Engineer"
    />
    <meta
      property="og:description"
      content="Portfolio of Jahid Hasan, a CSE graduate and React-focused frontend developer building modern web products and expanding into full-stack and AI-enabled engineering."
    />
    <meta property="og:image" content="/assets/og/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/og/og-default.png" />
    <!-- /route-meta -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
